name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
    paths:
      - 'status-page/**'

env:
  ECR_REGISTRY: 992382545251.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: ly-statuspage-repo
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Get latest tag from ECR
      id: get-tag
      run: |
        LATEST_TAG=$(aws ecr describe-images \
          --repository-name $ECR_REPOSITORY \
          --region $AWS_REGION \
          --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
          --output text 2>/dev/null || echo "v0")
        
        if [[ "$LATEST_TAG" =~ ^v[0-9]+$ ]]; then
            CURRENT_VERSION=${LATEST_TAG#v}
        else
            CURRENT_VERSION=0
        fi
        
        NEW_VERSION=$((CURRENT_VERSION + 1))
        NEW_TAG="v$NEW_VERSION"
        
        echo "latest-tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "new-tag=$NEW_TAG" >> $GITHUB_OUTPUT
        echo "🏷️  Latest: $LATEST_TAG, New: $NEW_TAG"

    - name: Build and push Docker image
      run: |
        echo "🔨 Building Docker image..."
        docker build -f status-page/Dockerfile -t statuspage-app:${{ steps.get-tag.outputs.new-tag }} ./status-page/
        docker tag statuspage-app:${{ steps.get-tag.outputs.new-tag }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.get-tag.outputs.new-tag }}
        
        echo "🚀 Pushing to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.get-tag.outputs.new-tag }}
        echo "✅ Image pushed: ${{ steps.get-tag.outputs.new-tag }}"

    - name: Update values.yaml
      run: |
        echo "📝 Updating values.yaml with new tag..."
        sed -i 's/tag: ".*"/tag: "${{ steps.get-tag.outputs.new-tag }}"/' terraform/charts/statuspage-chart/values.yaml
        
        echo "Updated values.yaml:"
        grep -A 2 -B 2 "tag:" terraform/charts/statuspage-chart/values.yaml
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add terraform/charts/statuspage-chart/values.yaml
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🚀 Deploy: Update image tag to ${{ steps.get-tag.outputs.new-tag }}"
          git push
          echo "✅ Changes pushed to repository"
        fi

    - name: Deployment summary
      run: |
        echo "🎉 Deployment completed!"
        echo "📦 Image: $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.get-tag.outputs.new-tag }}"
        echo "🔄 ArgoCD will sync automatically within 3 minutes"
        echo "🌐 Check your application status in ArgoCD UI"
